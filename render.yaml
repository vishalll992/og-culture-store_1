databases:
  - name: og-db
    plan: free
services:
  - type: web
    name: og-culture
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: og-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@ogculture.com
      - key: ADMIN_PASSWORD
        sync: false
